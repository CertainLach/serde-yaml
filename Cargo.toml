[package]
name = "serde_yaml_with_quirks"
version = "0.9.34"
authors = [
    "David Tolnay <dtolnay@gmail.com>",
    "Yaroslav Bolyukin <iam@lach.pw>",
]
categories = ["encoding", "parser-implementations"]
description = "YAML data format for Serde, fork with quirks support"
repository = "https://github.com/CertainLach/serde-yaml"
documentation = "https://docs.rs/serde_yaml_with_quirks/"
edition = "2021"
keywords = ["yaml", "serde", "serialization"]
license = "MIT OR Apache-2.0"
rust-version = "1.64"

[dependencies]
indexmap = "2.2.1"
itoa = "1.0"
ryu = "1.0"
serde = "1.0.195"
unsafe-libyaml = "0.2.11"

[dev-dependencies]
anyhow = "1.0.79"
indoc = "2.0"
serde_derive = "1.0.195"

[lib]
doc-scrape-examples = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]
